# Local smoke run of both images: docker compose up --build, then open http://localhost:8080
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: ghcr.io/pyldin601/zoom3d-server:local
    environment:
      # Optional: LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET (default: a `livekit-server --dev` on
      # ws://localhost:7880, run it on the host), RESUME_GRACE_MS, STATE_FILE (needs a volume)
      PORT: "8787"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ghcr.io/pyldin601/zoom3d-web:local
    environment:
      SERVER_URL: http://server:8787
    ports:
      - "8080:8080"
    depends_on:
      - server
