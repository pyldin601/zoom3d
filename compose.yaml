# Local smoke run of both images: docker compose up --build, then open http://localhost:8080
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: ghcr.io/pyldin601/zoom3d-server:local
    environment:
      # Optional: RESUME_GRACE_MS, STATE_FILE (needs a volume).
      # Media: run `livekit-server --dev` on the host; the image is production, so all three are required.
      PORT: "8787"
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ghcr.io/pyldin601/zoom3d-web:local
    environment:
      SERVER_URL: http://server:8787
    ports:
      - "8080:8080"
    depends_on:
      - server
