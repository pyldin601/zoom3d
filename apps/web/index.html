<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>zoom3d</title>
    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #stage { position: absolute; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #game { image-rendering: pixelated; }
      #hud { pointer-events: none; }
      #ui { position: absolute; inset: 0; pointer-events: none; color: #eee; font-family: system-ui, sans-serif; }
      #ui .screen { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, 0.55); }
      #ui .panel { pointer-events: auto; background: #1b1b1b; border: 0.15em solid #555; padding: 1.2em 1.6em; min-width: 14em; text-align: center; }
      #ui h1 { margin: 0 0 0.6em; font-size: 1.6em; letter-spacing: 0.05em; }
      #ui label { display: block; margin-bottom: 0.6em; }
      #ui input { font: inherit; display: block; width: 100%; box-sizing: border-box; margin-top: 0.3em; padding: 0.3em; }
      #ui button { font: inherit; padding: 0.3em 1em; cursor: pointer; }
      #ui select { font: inherit; padding: 0.3em; cursor: pointer; }
      /* Touch mode (mobile spec §2.5): every tap target is at least 44 px tall. */
      :where(html.touch) #ui button, :where(html.touch) #ui input { min-height: 44px; }
      /* Room touch controls (mobile spec §5), also on a touchscreen laptop once touched: the pad bottom-left, faded at
         rest; the drink and ⋯ buttons stacked above the self-view; the tray opens beside them. */
      #ui .touch-pad { position: absolute; left: calc(0.6em + env(safe-area-inset-left)); bottom: calc(0.6em + env(safe-area-inset-bottom)); width: max(132px, 7em); height: max(132px, 7em); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); opacity: 0.35; pointer-events: auto; touch-action: none; transition: opacity 0.15s; }
      #ui .touch-pad.active { opacity: 1; }
      #ui .touch-pad span { display: grid; place-items: center; margin: 2px; background: #222; border: 0.1em solid #888; border-radius: 0.25em; color: #eee; font-size: 0.9em; }
      #ui .touch-pad .up { grid-area: 1 / 2; }
      #ui .touch-pad .left { grid-area: 2 / 1; }
      #ui .touch-pad .right { grid-area: 2 / 3; }
      #ui .touch-pad .down { grid-area: 3 / 2; }
      #ui .touch-buttons { position: absolute; right: calc(0.6em + env(safe-area-inset-right)); bottom: calc(5.6em + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 0.4em; pointer-events: auto; }
      #ui .touch-buttons button { width: max(44px, 2.6em); height: max(44px, 2.6em); padding: 0; display: grid; place-items: center; color: #ddd; background: rgba(30, 30, 30, 0.85); border: 0.06em solid #555; border-radius: 0.3em; touch-action: none; -webkit-touch-callout: none; }
      #ui .touch-buttons button[hidden], #ui .tray[hidden] { display: none; }
      #ui .tray { position: absolute; right: calc(0.6em + max(44px, 2.6em) + 0.5em + env(safe-area-inset-right)); bottom: calc(5.6em + env(safe-area-inset-bottom)); display: flex; flex-direction: column; min-width: 8em; padding: 0.2em 0; background: rgba(15, 15, 15, 0.94); border: 0.1em solid #555; border-radius: 0.3em; pointer-events: auto; }
      #ui .tray button { display: flex; align-items: center; gap: 0.6em; min-height: 44px; padding: 0 0.8em; color: #ddd; background: none; border: 0; text-align: left; }
      #ui .tray button[aria-pressed="true"] { color: #8cf; }
      #ui .touch-buttons svg, #ui .tray svg { width: 1.3em; height: 1.3em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      #ui a { color: #8cf; display: inline-block; margin-top: 0.6em; }
      #ui .error { color: #f88; min-height: 1.2em; margin: 0.5em 0 0; }
      #ui .status { position: absolute; top: 40%; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.75); padding: 0.4em 1em; }
      #ui .roombar { position: absolute; top: 0.5em; right: 0.5em; display: flex; gap: 0.3em; font-size: 0.6em; pointer-events: auto; }
      #ui .roombar input { width: 18em; margin: 0; }
      #ui .roombar .toggle { padding: 0.25em 0.45em; display: grid; place-items: center; }
      #ui .banner { position: absolute; bottom: 0.6em; left: 50%; transform: translateX(-50%); background: rgba(80, 40, 0, 0.85); padding: 0.4em 1em; font-size: 0.75em; }
      #ui .avatar { flex: none; width: 3.5em; height: 3.5em; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: #444; font-weight: bold; font-size: 1.2em; }
      #ui .avatar img { width: 100%; height: 100%; object-fit: cover; }
      /* Lobby (lobby spec §2): 7.5em is the 176 px disc on a 720 px stage. Three shades: sunken dark fields,
         mid-grey secondary buttons, one blue primary (Join). */
      #ui .lobby { width: 11em; margin: 0 auto; }
      /* Shared by the lobby and the room bar. */
      #ui .lobby button, #ui .roombar button { color: #ddd; background: #2e2e2e; border: 0.06em solid #555; border-radius: 0.25em; }
      #ui .lobby button:disabled, #ui .roombar button:disabled { opacity: 0.45; cursor: not-allowed; }
      #ui .lobby input, #ui .roombar input { padding: 0.35em; color: #eee; background: #0f0f0f; border: 0.06em solid #555; border-radius: 0.25em; outline: none; }
      #ui .lobby input::placeholder { color: #777; }
      #ui .lobby input:focus, #ui .roombar input:focus { border-color: #6aa8ff; }
      #ui .lobby svg, #ui .roombar svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
      #ui .lobby svg .meter { fill: #6c6; stroke: none; }
      #ui .roombar .toggle.off { color: #f99; background: #3a2020; border-color: #844; }
      #ui .roombar .toggle svg { width: 1.4em; height: 1.4em; }
      #ui .lobby-disc { position: relative; width: 7.5em; height: 7.5em; margin: 0 auto 0.6em; overflow: visible; border: 0.05em solid #555; }
      #ui .lobby-disc video, #ui .lobby-disc .face { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-size: 1.6em; }
      #ui .lobby-disc video { object-fit: cover; transform: scaleX(-1); font-size: inherit; }
      #ui .lobby-disc .face img { width: 100%; height: 100%; object-fit: cover; }
      #ui .lobby .pencil { position: absolute; right: 0.2em; bottom: 0.2em; width: 1.5em; height: 1.5em; padding: 0; border-radius: 50%; font-size: 0.8em; }
      #ui .lobby .picture-menu, #ui .lobby .device-menu { position: absolute; z-index: 1; display: flex; flex-direction: column; min-width: 10em; background: #161616; border: 0.1em solid #555; border-radius: 0.25em; padding: 0.2em 0; font-size: 0.6em; white-space: nowrap; }
      #ui .lobby .picture-menu { left: 100%; bottom: 0; }
      #ui .lobby .device-menu { top: calc(100% + 0.3em); left: 0; }
      #ui .lobby .picture-menu button, #ui .lobby .device-menu button { display: block; width: 100%; background: none; border: 0; border-radius: 0; color: inherit; text-align: left; padding: 0.35em 0.8em; overflow: hidden; text-overflow: ellipsis; }
      /* A fixed check column keeps every device name aligned, ticked or not. */
      #ui .lobby .device-menu button::before { content: ''; display: inline-block; width: 1.3em; }
      #ui .lobby .device-menu [aria-checked="true"]::before { content: '✓'; }
      #ui .lobby .devices { display: flex; gap: 0.4em; justify-content: center; margin-bottom: 0.7em; }
      #ui .lobby .split { position: relative; display: flex; }
      #ui .lobby .split > button { padding: 0.25em 0.4em; display: grid; place-items: center; }
      #ui .lobby .split > .toggle { border-radius: 0.25em 0 0 0.25em; }
      #ui .lobby .split > .chevron { border-left: 0; border-radius: 0 0.25em 0.25em 0; font-size: 0.7em; }
      #ui .lobby .split.off > button { color: #f99; background: #3a2020; border-color: #844; }
      #ui .lobby form input { margin: 0 0 0.45em; text-align: center; }
      #ui .lobby form [type="submit"], #ui .lobby .primary { width: 100%; padding: 0.35em; color: #fff; background: #2f6fd0; border-color: #2f6fd0; font-weight: 600; }
      /* Landing: the title picture (landing-scene.ts) shows undimmed; the lobby keeps the dim. The panel sits in the
         bottom-right corner, inset like the logo above it (28 of 640 px). Percentage padding is relative to the width
         on all sides. */
      #ui .screen:has(.landing) { background: none; place-items: end end; padding: 0 4.375% 4.375% 0; }
      #ui .landing { width: 14em; }
      /* The title is drawn into the picture (landing-logo.ts); the heading stays for screen readers. */
      #ui .landing h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      #ui .landing p { margin: 0 0 0.8em; color: #bbb; font-size: 0.75em; }
      #ui .landing .privacy { color: #888; font-size: 0.6em; }
      #ui .lobby [hidden] { display: none; }
      #ui .selfview { position: absolute; right: 0.6em; bottom: 0.6em; width: 4.5em; height: 4.5em; border-radius: 50%; overflow: hidden; border: 0.12em solid #ddd; }
      #ui .selfview[hidden] { display: none; }
      #ui .selfview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
      #ui .selfview .face { width: 100%; height: 100%; display: grid; place-items: center; background: #444; font-weight: bold; font-size: 1.3em; }
      #ui .selfview .face img { width: 100%; height: 100%; object-fit: cover; }
      #ui .selfview .face[hidden] { display: none; }
      #ui .audio-panel { position: absolute; top: 2.2em; left: 0.6em; display: flex; gap: 1.2em; align-items: flex-start; pointer-events: auto; background: rgba(15, 15, 15, 0.92); border: 0.1em solid #555; padding: 0.6em 0.8em; font-size: 0.6em; }
      #ui .audio-panel h2 { margin: 0 0 0.5em; font-size: 1.1em; }
      #ui .audio-panel .tuning { width: 16em; }
      #ui .audio-panel .boombox-slot { width: 14em; }
      #ui .audio-panel .boombox-slot:empty { display: none; }
      #ui .audio-panel label { display: grid; grid-template-columns: 1fr; margin-bottom: 0.4em; }
      #ui .audio-panel input[type=range] { width: 100%; margin: 0.2em 0 0; padding: 0; }
      #ui .audio-panel .value { opacity: 0.75; }
      #ui .audio-panel .levels { list-style: none; padding: 0; margin: 0.6em 0 0; }
      #ui .audio-panel .levels li { display: grid; grid-template-columns: 6em 1fr; align-items: center; gap: 0.4em; }
      #ui .audio-panel .bar { height: 0.5em; background: #6c6; }
      #ui .boombox-panel .title { margin-bottom: 0.4em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* visibility:hidden, not opacity: a visible playing <video> makes Chrome pace the page to the
         video's 30 fps. Hidden elements keep decoding, firing requestVideoFrameCallback and feeding Web Audio. */
      /* Touch mode (mobile spec §2.4): no page gestures on the stage, readable inputs (iOS zooms below 16 px), and room
         overlays kept clear of the notch and home bar. */
      html.touch #stage { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      html.touch #ui input { font-size: max(16px, 1em); -webkit-user-select: text; user-select: text; }
      html.touch #ui .roombar { top: calc(0.5em + env(safe-area-inset-top)); right: calc(0.5em + env(safe-area-inset-right)); }
      html.touch #ui .selfview { right: calc(0.6em + env(safe-area-inset-right)); bottom: calc(0.6em + env(safe-area-inset-bottom)); }
      html.touch #ui .banner { bottom: calc(0.6em + env(safe-area-inset-bottom)); }
      html.touch #ui .status, html.touch #ui .banner { max-width: calc(100% - 32px); box-sizing: border-box; text-align: center; }
      /* Touch landing and lobby (mobile spec §3): the panel spans the bottom under the centred title, tap targets are
         at least 44 px, and the picture menu opens below the disc instead of off the right edge. */
      html.touch #ui .screen:has(.landing) { place-items: end center; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); }
      html.touch #ui .landing { width: min(14em, 100%); }
      html.touch #ui .lobby .split > button { min-width: 44px; }
      html.touch #ui .lobby .pencil { width: 44px; height: 44px; font-size: inherit; }
      html.touch #ui .lobby .picture-menu { left: 50%; top: 100%; bottom: auto; transform: translateX(-50%); }
      #media, #local-media { position: fixed; width: 1px; height: 1px; visibility: hidden; pointer-events: none; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="640" height="360"></canvas>
      <canvas id="hud"></canvas>
      <div id="ui"></div>
    </div>
    <div id="media" aria-hidden="true"></div>
    <div id="local-media" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
